name: Send FMS Outlook update email

# Daily: scrape the Fiji Meteorological Service 5-day TC outlook PDF and email
# the per-day formation risk through Listmonk. FMS issues the outlook at
# 04:00 UTC; the 05:00 UTC cron usually starts 50-70 minutes late on GitHub.
#
# Run modes (KB infrastructure/email-testing.md): TEST_EMAIL and DRY_RUN
# default to true here and in the code. Scheduled runs take the repo
# variables: TEST_EMAIL=true sends to the test list (5) only,
# TEST_EMAIL=false to the real list (9); DRY_RUN must be false to send.

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send to the test list (true) or the real list (false)"
        type: choice
        options: ["true", "false"]
        default: "true"
      dry_run:
        description: "Scrape and print only; no Listmonk calls"
        type: choice
        options: ["false", "true"]
        default: "false"
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ubuntu-latest is Ubuntu 26.04 from late 2026; without a pin uv picks
      # the newest Python
      UV_PYTHON: "3.11"
      # ocha-relay reads DSCI_LISTMONK_BASE_URL; the org secret is
      # DSCI_LISTMONK_API_URL
      DSCI_LISTMONK_BASE_URL: ${{ secrets.DSCI_LISTMONK_API_URL }}
      DSCI_LISTMONK_API_USERNAME: ${{ secrets.DSCI_LISTMONK_API_USERNAME }}
      DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY }}
      TEST_EMAIL: ${{ inputs.test_email || vars.TEST_EMAIL || 'true' }}
      DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || 'true' }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Send outlook email
        run: uv run python -m pipelines.update_fms_outlook
